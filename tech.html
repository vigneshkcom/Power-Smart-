<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Electrician App - PowerSmart</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2343A8B6'/%3E%3Cpath d='M36 8 16 36h12l-4 20 20-28H32l4-20z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#43A8B6;--teal-dark:#2E8494;--teal-deep:#1E5F6B;--teal-soft:#E7F4F6;--teal-bright:#7FD6E2;
    --ink:#0B1B1F;--body:#41585D;--muted:#6B8288;--line:rgba(11,27,31,.10);--paper:#F4F9FA;
    --amber:#F5B841;--red:#C95555;--green:#2F9E6E;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#EDF3F4;min-height:100vh;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:inherit}
  .app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
  .view{display:none}.view.show{display:block}

  /* header */
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .bar img{height:26px}
  .bar h1{font-size:.98rem;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .back{font-weight:800;font-size:1.3rem;line-height:1;padding:4px 8px 4px 0;color:var(--teal-deep)}
  .link{font-size:.78rem;font-weight:700;color:var(--teal-deep);text-decoration:underline}

  .btn{display:flex;align-items:center;justify-content:center;gap:.45rem;font-weight:700;font-size:.95rem;min-height:50px;padding:.7rem 1.1rem;border-radius:14px;width:100%;text-decoration:none;transition:transform .12s ease,background .15s ease}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--teal);color:var(--ink)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-ghost{border:1.5px solid var(--line);background:#fff;color:var(--body)}
  .btn-green{background:var(--green);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .row{display:flex;gap:10px}.row>*{flex:1}

  .sync{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700;font-size:.85rem}
  .sync.warn{background:#FFF4E0;color:#8A5A0B;flex-wrap:wrap}.sync.warn .btn{width:auto;min-height:44px;margin-left:auto}.sync.ok{background:#E3F5EC;color:#1E6B49}
  .booked{font-size:.88rem;font-weight:600;color:var(--teal-deep);background:var(--teal-soft);border-radius:10px;padding:8px 12px;margin-bottom:6px}
  .q{font-weight:700;font-size:.9rem;margin:12px 0 6px}
  .unit .uthumb{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--muted)}
  .unit .uthumb img{width:100%;height:100%;object-fit:cover}
  .draft{border:1.5px solid var(--teal);border-radius:14px;padding:12px;margin-top:10px;background:#F7FCFD}
  .draft .field{margin-bottom:10px}.draft select,.draft input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font-size:1rem;background:#fff}
  .draft .shot{display:flex;align-items:center;gap:10px;margin:10px 0}.draft .shot img{width:64px;height:64px;border-radius:10px;object-fit:cover}
  #so-sig{width:100%;height:150px;border:1.5px dashed var(--teal);border-radius:12px;background:#fff;touch-action:none}
  .chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem;font-weight:600}.chk input{width:22px;height:22px;accent-color:var(--teal)}
  .ph-row{display:flex;gap:8px;margin-bottom:8px}
  .ph-row select{flex:1;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font-size:1rem;background:#fff}
  .ph-row .btn{flex:1;margin:0;cursor:pointer}
  .ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .ph-grid button{border:1px solid var(--line);border-radius:10px;padding:0;background:#f4f9fa;aspect-ratio:1;overflow:hidden}
  .ph-grid img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-cap{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px;grid-column:1/-1}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card h2{font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);font-size:.75rem}
  .card h2 .n.ok{background:var(--green);color:#fff}
  .card h2 .side{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--muted)}
  .muted{color:var(--muted);font-size:.8rem}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .field input,.field select,.field textarea{padding:.8rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);outline:none;font-size:1rem;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff}
  .err{color:var(--red);font-size:.8rem;font-weight:600;min-height:1.2em;margin-bottom:8px}

  /* login */
  .login{padding-top:12vh;text-align:center}
  .login img{height:44px;margin:0 auto 18px;display:block}
  .login h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
  .login .card{text-align:left;margin-top:22px}

  /* job list */
  .daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .daynav button{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:1.1rem;font-weight:800;color:var(--teal-deep)}
  .daynav .lbl{flex:1;text-align:center;font-weight:800}
  .daynav .lbl small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
  .jcard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:16px;padding:14px;margin-bottom:10px}
  .jcard .top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:700;color:var(--body)}
  .jcard .name{font-size:1.02rem;font-weight:800;margin:4px 0 2px}
  .jcard .addr{font-size:.85rem;color:var(--body)}
  .jcard .meta{font-size:.75rem;color:var(--muted);margin-top:6px}
  .chip{display:inline-block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep)}
  .st-en_route{border-left-color:#4F86E8}.chip.st-en_route{background:#E4EDFC;color:#2B5DB8}
  .st-on_site{border-left-color:#8B68D6}.chip.st-on_site{background:#EEE8FA;color:#5E3FA8}
  .st-partial{border-left-color:#F2B01E}.chip.st-partial{background:#FDF1CF;color:#8A6200}
  .st-completed{border-left-color:#E39A55}.chip.st-completed{background:#FBEBDC;color:#9A5A1C}
  .empty{text-align:center;padding:40px 10px;color:var(--muted)}
  .next{display:block;width:100%;text-align:left;background:var(--teal-soft);border-radius:14px;padding:12px 14px;margin-top:-20px;font-size:.88rem;color:var(--teal-deep)}
  .next b{display:block;color:var(--ink);font-size:.98rem}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head button{width:40px;height:40px;border-radius:11px;background:var(--teal-soft);color:var(--teal-deep);font-size:1.1rem;font-weight:800}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-dow span{text-align:center;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--muted);padding:4px 0}
  .cal-grid button{aspect-ratio:1;border-radius:11px;font-weight:700;font-size:.9rem;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
  .cal-grid button.out{background:none;color:#B7C4C7}
  .cal-grid button.today{box-shadow:inset 0 0 0 2px var(--teal)}
  .cal-grid button.sel{background:var(--ink);color:#fff}
  .cal-grid button i{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--teal);color:var(--ink);font-style:normal;font-size:.6rem;line-height:16px}

  /* job */
  .cust .name{font-size:1.15rem;font-weight:800}
  .cust .addr{color:var(--body);margin:2px 0 12px}
  .notes{background:#FFF8E6;border:1px solid #F3DFA8;border-radius:12px;padding:10px 12px;font-size:.84rem;white-space:pre-wrap;margin-top:12px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.88rem;color:var(--body)}
  .seg button.on{background:var(--teal);border-color:var(--teal);color:var(--ink)}

  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none;padding-top:0}
  .item .lab{flex:1;min-width:0;font-size:.88rem;font-weight:600}
  .item .lab small{display:block;color:var(--muted);font-weight:500;font-size:.75rem}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:40px;height:40px;border-radius:11px;background:var(--teal-soft);color:var(--teal-deep);font-size:1.25rem;font-weight:800}
  .step span{min-width:26px;text-align:center;font-weight:800;font-size:1.05rem}
  .item .del{color:var(--red);font-weight:700;font-size:.78rem;padding:4px}
  .other{display:grid;grid-template-columns:1fr 92px;gap:8px;margin-top:6px}
  .other input{padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:11px;background:var(--paper);font-size:.95rem;outline:none;width:100%}
  .tot{margin-top:12px;border-top:1.5px solid var(--line);padding-top:10px;font-size:.9rem}
  .tot div{display:flex;justify-content:space-between;padding:3px 0}
  .tot .due{font-size:1rem;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
  .inv-row{display:grid;grid-template-columns:1fr 84px 70px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem}
  .inv-row .q{text-align:center;font-weight:600}.inv-row .a{text-align:right;font-weight:700}.inv-row .d{min-width:0}
  .inv-h{padding:0 0 6px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.inv-h .q,.inv-h .a{font-weight:800}
  .inv-row .step{justify-content:center;gap:4px}.inv-row .step button{width:30px;height:30px;font-size:1rem;border-radius:8px}.inv-row .step span{min-width:18px;font-size:.9rem}
  .inv-row .del{display:block;color:var(--red);font-weight:700;font-size:.72rem;padding:2px 0}
  .ok-banner{display:flex;align-items:center;gap:8px;background:#E3F5EC;color:#1E6B49;border-radius:12px;padding:10px 12px;font-weight:700;font-size:.88rem;margin-bottom:10px}
  .warn-banner{background:#FFF4E0;color:#8A5A0B;border-radius:12px;padding:10px 12px;font-weight:600;font-size:.84rem;margin-bottom:10px}
  .stack>*+*{margin-top:10px}
  .done-view{text-align:center;padding-top:10vh}
  .done-view .tick{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:2.6rem;display:grid;place-items:center;margin:0 auto 16px}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:14px;font-size:.88rem;font-weight:600;transition:transform .25s ease;z-index:50;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .loading{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="app">

  <!-- sign in -->
  <section class="view login" id="v-login">
    <img src="assets/logo/power-smart-logo-transparent.png" alt="Power Smart Co">
    <h1>Electrician sign in</h1>
    <p class="muted">Your jobs, invoices and payments.</p>
    <div class="card">
      <div class="field"><label for="l-code">Your electrician code</label><input id="l-code" type="password" inputmode="numeric" autocomplete="current-password" maxlength="20" placeholder="e.g. 1011" style="font-size:1.4rem;letter-spacing:.2em;text-align:center"></div>
      <div class="err" id="l-err"></div>
      <button class="btn btn-primary" id="l-go">Sign in</button>
      <p class="muted" style="margin-top:12px;text-align:center">Don't know your code? Ask the office.</p>
    </div>
  </section>

  <!-- job list -->
  <section class="view" id="v-list">
    <div class="bar">
      <img src="assets/logo/power-smart-logo-transparent.png" alt="">
      <h1 id="hello">My jobs</h1>
      <button class="link" id="signout">Sign out</button>
    </div>
    <div class="daynav">
      <button id="d-prev" aria-label="Previous day">‹</button>
      <div class="lbl" id="d-lbl"></div>
      <button id="d-next" aria-label="Next day">›</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn btn-ghost" id="cal-btn" aria-expanded="false">Calendar</button>
      <button class="btn btn-ghost" id="d-today">Today</button>
    </div>
    <div class="card cal" id="cal" hidden>
      <div class="cal-head"><button id="cal-prev" aria-label="Previous month">‹</button><b id="cal-title"></b><button id="cal-next" aria-label="Next month">›</button></div>
      <div class="cal-grid cal-dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div id="jobs"><div class="loading">Loading…</div></div>
  </section>

  <!-- job -->
  <section class="view" id="v-job">
    <div class="bar">
      <button class="back" id="j-back" aria-label="Back to jobs">‹</button>
      <h1 id="j-title">Job</h1>
      <span class="chip" id="j-chip"></span>
    </div>
    <div id="j-body"><div class="loading">Loading…</div></div>
  </section>

  <!-- completed -->
  <section class="view done-view" id="v-done">
    <div class="tick">✓</div>
    <h1 style="font-size:1.4rem;font-weight:800">Job completed</h1>
    <p class="muted" id="done-msg" style="margin:8px 0 24px"></p>
    <button class="btn btn-primary" id="done-back">Back to my jobs</button>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var API = "/api/pipeline?resource=tech";
  var LS = "powersmart_tech";
  var $ = function(id){ return document.getElementById(id); };
  // Open jobs with synchronized alarms or invoice lines show as Partial (same rule as the office schedule).
  function statusKey(j){
    if (j.status === "completed" || j.status === "cancelled") return j.status;
    return (Array.isArray(j.alarm_units) && j.alarm_units.length) || (Array.isArray(j.invoice_items) && j.invoice_items.length) ? "partial" : j.status;
  }
  var STATUS = { partial:"Partial", scheduled:"Scheduled", en_route:"On the way", on_site:"On site", completed:"Completed", cancelled:"Cancelled" };
  var TYPES = { install:"Install", inspection:"Inspection", service:"Service" };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function money(c){ return "$" + (c / 100).toFixed(2); }
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function timeLabel(d){ var h = d.getHours(); return (h % 12 || 12) + ":" + pad(d.getMinutes()) + " " + (h < 12 ? "am" : "pm"); }
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 3200); }
  function show(v){ ["v-login","v-list","v-job","v-done"].forEach(function(id){ $(id).classList.toggle("show", id === v); }); window.scrollTo(0, 0); }

  var me = null;
  try { me = JSON.parse(localStorage.getItem(LS) || "null"); } catch(e){}
  var day = startOfDay(new Date());
  var cur = null;       // open job detail from the API
  var saveTimer = null;

  function call(action, body){
    var headers = { "Content-Type":"application/json" };
    if (me){ headers["x-tech-code"] = me.code; }
    return fetch(API, { method:"POST", headers: headers, body: JSON.stringify(Object.assign({ action: action }, body || {})) })
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(d){
          if (r.status === 401 && action !== "me"){ signOut(); throw new Error(d.error || "Please sign in again"); }
          if (!r.ok) throw new Error(d.error || ("Error " + r.status));
          return d;
        });
      });
  }

  /* ---------- sign in ---------- */
  function showLogin(){
    show("v-login");
    setTimeout(function(){ $("l-code").focus(); }, 50);
  }
  function signIn(){
    var code = $("l-code").value.trim();
    if (!code){ $("l-err").textContent = "Enter your code."; return; }
    me = { code: code };
    $("l-go").disabled = true; $("l-err").textContent = "";
    call("me").then(function(d){
      me = { code: code, name: d.tech.name };
      try { localStorage.setItem(LS, JSON.stringify(me)); } catch(e){}
      $("l-code").value = "";
      route();
    }).catch(function(e){ me = null; $("l-err").textContent = e.message; })
      .finally(function(){ $("l-go").disabled = false; });
  }
  function signOut(){
    me = null; try { localStorage.removeItem(LS); } catch(e){}
    showLogin();
  }
  $("l-go").addEventListener("click", signIn);
  $("l-code").addEventListener("keydown", function(e){ if (e.key === "Enter") signIn(); });
  $("signout").addEventListener("click", signOut);

  /* ---------- job list ---------- */
  function dayLabel(d){
    var t = startOfDay(new Date()), diff = Math.round((d - t) / 864e5);
    var name = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : d.toLocaleDateString("en-AU", { weekday:"long" });
    return name + "<small>" + d.toLocaleDateString("en-AU", { weekday:"short", day:"numeric", month:"short" }) + "</small>";
  }
  function loadList(){
    show("v-list");
    $("hello").textContent = "Hi " + ((me && me.name) || "").split(" ")[0];
    $("d-lbl").innerHTML = dayLabel(day);
    $("d-today").disabled = +day === +startOfDay(new Date());
    $("jobs").innerHTML = '<div class="loading">Loading…</div>';
    if (!$("cal").hidden) renderCal();
    var lk = "pslist_" + (+day);
    call("jobs", { from: day.toISOString(), to: addDays(day, 1).toISOString() }).then(function(d){
      try { localStorage.setItem(lk, JSON.stringify(d)); } catch(e){}
      return d;
    }, function(err){
      var c = null; try { c = JSON.parse(localStorage.getItem(lk) || "null"); } catch(e){}
      if (!c) throw err;
      toast("No signal: showing the last saved list");
      return c;
    }).then(function(d){
      if (d.tech) me.name = d.tech.name;
      var jobs = d.jobs || [];
      $("jobs").innerHTML = jobs.length ? jobs.map(function(j){
        var s = new Date(j.scheduled_start), e = new Date(+s + (j.duration_min || 60) * 6e4);
        var sk = statusKey(j);
        return '<button class="jcard st-' + esc(sk) + '" data-job="' + esc(j.id) + '">' +
          '<div class="top"><span>' + timeLabel(s) + ' – ' + timeLabel(e) + ' · J' + esc(j.job_no) + '</span><span class="chip st-' + esc(sk) + '">' + esc(STATUS[sk] || sk) + '</span></div>' +
          '<div class="name">' + esc(j.customer_name) + '</div>' +
          '<div class="addr">' + esc([j.address, j.suburb, j.postcode].filter(Boolean).join(", ") || "No address") + '</div>' +
          '<div class="meta">' + esc(TYPES[j.work_type] || "") + (j.alarms ? " · " + j.alarms + " alarms" : "") + (j.pay_status === "paid" ? " · Paid" : "") + '</div></button>';
      }).join("") : '<div class="empty">No jobs booked for this day.</div><div id="next-job"></div>';
      if (!jobs.length) showNextJob();

      $("j-body").innerHTML = html; return;
    }

    html += '<div id="sync-bar">' + syncBarHtml() + '</div>';

    // status
    if (j.status === "scheduled" || j.status === "en_route") html += '<button class="btn btn-primary" data-status="on_site" style="margin-bottom:12px">Arrived on site</button>';

    // 1. smoke alarms, added one at a time with a photo
    var paid = j.pay_status === "paid", approved = !!j.approved_at, due = cur.totals.due;
    var units = unitList();
    var nBat = units.filter(function(u){ return u.type === "battery"; }).length, nHw = units.length - nBat;
    var bookedParts = [];
    if (cur.quote && cur.quote.alarm_qty) bookedParts.push(cur.quote.alarm_qty + " smoke alarm" + (cur.quote.alarm_qty === 1 ? "" : "s"));
    if (cur.quote && cur.quote.controller_qty) bookedParts.push(cur.quote.controller_qty + " remote controller" + (cur.quote.controller_qty === 1 ? "" : "s"));
    else if (!bookedParts.length && j.alarms) bookedParts.push(j.alarms + " smoke alarms");
    html += '<div class="card"><h2><span class="n' + (units.length ? " ok" : "") + '">' + (units.length ? "✓" : "1") + '</span>Smoke alarms</h2>' +
      (bookedParts.length ? '<div class="booked">Booked: ' + esc(bookedParts.join(", ")) + '</div>' : '');
    units.forEach(function(u, i){
      var th = u.photoKey ? localThumb(u.photoKey) : thumbFor(u.photo);
      html += '<div class="item unit"><div class="uthumb">' + (th ? '<img src="' + esc(th) + '" alt="Alarm photo">' : (u.photo ? "Photo" : "–")) + '</div>' +
        '<div class="lab">Smoke Alarm ' + (i + 1) + '<small>' + esc(u.location) + ' · ' + (u.type === "hardwired" ? "Hardwired" : "Battery") + (u.photoKey ? " · photo waiting to sync" : "") + '</small></div>' +
        (paid ? '' : '<button class="del" data-unit-del="' + i + '">Delete</button>') + '</div>';
    });
    if (!paid) html += draft ? draftForm() : '<button class="btn btn-ghost" id="u-add" style="margin-top:10px">＋ Add smoke alarm</button>';
    html += '<div class="tot"><div><span>Total installed</span><b id="n-alarms">' + units.length + '</b></div>' +
      (units.length ? '<div class="muted"><span>' + nBat + ' battery · ' + nHw + ' hardwired</span></div>' : '') + '</div>' +
      '<div class="field" style="margin:14px 0 0"><label for="j-notes">Notes (optional)</label>' +
      '<textarea id="j-notes" rows="2" placeholder="Anything the office should know">' + esc(j.tech_notes || "") + '</textarea></div></div>';

    // 2. invoice: a plain line-item table; starts empty, shows only what has been recorded
    var extras = cur.catalogue.filter(function(p){ return !isAlarm(p.code); });
    var short = function(l){ return String(l).replace(/\s*[\u2013-]\s*supplied (&|and) installed/i, ""); };
    var line = function(desc, qtyCell, amount, extra){ return '<div class="inv-row"><div class="d">' + desc + (extra || "") + '</div><div class="q">' + qtyCell + '</div><div class="a">' + money(amount) + '</div></div>'; };
    var rowsHtml = cur.items.map(function(it, i){
      if (isAlarm(it.code)) return line(esc(short(it.label)), it.qty, it.amount_cents);
      if (it.code === "other") return line(esc(it.label), it.qty, it.amount_cents, paid ? "" : '<button class="del" data-del="' + i + '">Remove</button>');
      return line(esc(short(it.label)), stepper(it.code, it.qty, paid), it.amount_cents);
    }).join("");
    html += '<div class="card"><h2><span class="n">2</span>Invoice<span class="side">Prices incl. GST</span></h2>' +
      (cur.items.length ? '<div class="inv"><div class="inv-row inv-h"><div class="d">Description</div><div class="q">Qty</div><div class="a">Amount</div></div>' + rowsHtml + '</div>' : '<p class="muted">Alarms and items appear here as you add them.</p>') +
      (paid ? '' : '<details style="margin-top:8px"><summary class="link" style="cursor:pointer">+ Add item</summary>' +
        extras.filter(function(p){ return itemQty(p.code) === 0; }).map(function(p){
          return '<div class="item"><div class="lab">' + esc(short(p.label)) + '<small>' + money(p.cents) + ' each</small></div>' + stepper(p.code, 0, false) + '</div>';
        }).join("") +
        '<div class="other"><input id="o-label" placeholder="e.g. Extra callout"><input id="o-price" inputmode="decimal" placeholder="$ each"></div>' +
        '<button class="btn btn-ghost" id="o-add" style="margin-top:8px;min-height:44px">Add item</button></details>') +
      (cur.items.length ? '<div class="tot"><div><span>Total (incl. GST)</span><span>' + money(cur.totals.total) + '</span></div>' +
      cur.credits.map(function(cr){ return '<div class="muted"><span>Less paid in advance: ' + esc(cr.label) + '</span><span>\u2212' + money(cr.cents) + '</span></div>'; }).join("") +
      '<div class="due"><span>Amount due</span><span>' + money(cur.totals.due) + '</span></div></div>' : '') +
      (cur.booking_fee_cents ? '<p class="muted" style="margin-top:8px">Booking fee of ' + money(cur.booking_fee_cents) + ' was paid earlier and is not included above.</p>' : '') + '</div>';

    // 3. payment details
    var cardPaid = paid && (!j.pay_method || j.pay_method === "card");
    if (paid){ pay.full = true; pay.method = j.pay_method || "card"; }
    html += '<div class="card"><h2><span class="n' + (approved ? " ok" : "") + '">' + (approved ? "✓" : "3") + '</span>Payment details</h2>';
    if (!alarmsDone()) html += '<div class="warn-banner">Add the smoke alarms first.</div>';
    if (!approved){
      html += '<p class="muted" style="margin-bottom:10px">Show the customer the invoice above. Once they say okay, tap below.</p>' +
        '<button class="btn btn-primary" id="approve"' + (alarmsDone() ? "" : " disabled") + '>Customer approves ' + money(cur.totals.total) + '</button>';
    } else {
      html += '<div class="ok-banner">Customer approved at ' + timeLabel(new Date(j.approved_at)) + '</div>';
      if (due <= 0 && !paid) html += '<div class="ok-banner">Nothing to pay on site</div>';
      else if (cardPaid) html += '<div class="ok-banner">Paid ' + money(j.paid_cents || due) + ' by card</div>';
      else {
        html += '<div class="q">Has the customer paid in full?</div>' +
          '<div class="seg" data-seg="full"><button data-v="yes" class="' + (pay.full === true ? "on" : "") + '">Yes</button><button data-v="no" class="' + (pay.full === false ? "on" : "") + '">No</button></div>';
        if (pay.full === true){
          html += '<div class="q">How did they pay?</div><div class="seg" data-seg="method">' +
            [["card", "Card (Stripe)"], ["cash", "Cash"]].map(function(m){
              return '<button data-v="' + m[0] + '" class="' + (pay.method === m[0] ? "on" : "") + '">' + m[1] + '</button>'; }).join("") + '</div>';
          if (pay.method === "card"){
            html += '<div class="stack" style="margin-top:10px"><button class="btn btn-dark" id="pay">Take card payment ' + money(due) + '</button>' +
              (j.pay_status === "pending" ? '<button class="btn btn-ghost" id="paycheck">Check payment status</button>' : '') +
              '<p class="muted">Opens the secure Stripe page. Hand the phone to the customer to tap their card details or Apple/Google Pay.</p></div>';
          } else if (pay.method === "cash"){
            var rth = pay.receiptKey ? localThumb(pay.receiptKey) : "";
            var haveReceipt = !!(pay.receiptKey || j.pay_receipt);
            html += '<div class="shot" style="margin-top:10px">' + (rth ? '<img src="' + esc(rth) + '" alt="Cash receipt">' : "") +
              '<label class="btn ' + (haveReceipt ? "btn-ghost" : "btn-primary") + '" style="min-height:46px;margin:0">' + (haveReceipt ? "Retake receipt photo" : "Take photo of the cash receipt") +
              '<input id="rc-file" type="file" accept="image/*" capture="environment" hidden></label></div>' +
              '<p class="muted" style="margin-top:8px">' + money(due) + ' received in cash. A photo of the receipt is required' + (j.pay_receipt && !pay.receiptKey ? " (saved)" : "") + '. The paid tax invoice and compliance certificate are emailed when you complete the job.</p>';
          }
        } else if (pay.full === false){
          html += '<div class="warn-banner" style="margin-top:10px">A pending invoice for ' + money(due) + ' will be emailed to the customer. No compliance certificate goes out until it is paid.</div>';
        }
      }
    }
    html += '</div>';

    // 4. work sign off
    var payReady = due <= 0 || paid || pay.full === false || (pay.full === true && pay.method === "cash" && !!(pay.receiptKey || j.pay_receipt));
    html += '<div class="card"><h2><span class="n">4</span>Work sign off</h2>' +
      '<div id="so-lock"' + (dirty || syncing ? "" : " hidden") + '><p class="muted">Work sign off opens once this job is synchronized.</p>' +
        '<button class="btn btn-primary" id="so-open" style="margin-top:10px">' + (syncing ? "Synchronizing…" : "Open work sign off") + '</button></div>' +
      '<div id="so-form"' + (dirty || syncing ? " hidden" : "") + '>' +
      '<div class="field"><label for="so-name">Electrician name</label><input id="so-name" value="' + esc(soName || (me && me.name) || "") + '" autocomplete="off"></div>' +
      '<div class="field" style="margin-top:10px"><label>Signature</label><canvas id="so-sig" width="600" height="180"></canvas>' +
      '<button class="link" id="so-clear" style="align-self:flex-start;margin-top:4px">Clear signature</button></div>' +
      '<label class="chk"><input type="checkbox" id="so-ok"' + (soOk ? " checked" : "") + '> I confirm the work is complete.</label>' +
      '<button class="btn btn-green" id="complete" style="margin-top:12px" disabled>Complete job &amp; send ' + (due <= 0 || paid || pay.full === true ? "invoice" : "pending invoice") + '</button>' +
      '<div id="sync-bar2" style="margin-top:10px">' + (dirty && !syncing ? '<button class="btn btn-primary" data-sync>Synchronize</button>' : '') + '</div>' +
      '<p class="muted" id="so-hint" style="margin-top:8px"></p></div></div>';
    completeState = { alarms: alarmsDone(), approved: approved, payReady: payReady };

    $("j-body").innerHTML = html;
    initSignature(); updateComplete();
  }

  // Delegated job-screen interactions
  $("j-body").addEventListener("click", function(e){
    var t = e.target;
    var st = t.closest("[data-status]");
    if (st){ st.disabled = true; call("status", { id: cur.job.id, status: st.dataset.status }).then(function(d){ cur.job.status = d.job.status; renderJob(); toast(STATUS[d.job.status]); }).catch(function(err){ st.disabled = false; toast(err.message); }); return; }

    var stepBtn = t.closest(".step button");
    if (stepBtn){
      var code = stepBtn.parentNode.dataset.code, q = Math.max(0, Math.min(50, itemQty(code) + Number(stepBtn.dataset.d)));
      setItems(cur.items.filter(function(i){ return i.code !== code; }).concat(q ? [{ code: code, qty: q, label: "", unit_cents: 0, amount_cents: 0 }] : []));
      return;
    }
    var del = t.closest("[data-del]");
    if (del){ var copy = cur.items.slice(); copy.splice(Number(del.dataset.del), 1); setItems(copy); return; }
    if (t.id === "o-add"){
      var label = $("o-label").value.trim(), price = $("o-price").value.trim().replace(/^\$/, "");
      if (!label || !/^\d+(\.\d{1,2})?$/.test(price)){ toast("Enter what the item is and its price"); return; }
      setItems(cur.items.concat([{ code:"other", label: label, price: price, qty: 1 }])); return;
    }
    if (t.id === "approve"){
      cur.job.approved_at = new Date().toISOString(); markDirty(); keepScroll(renderJob); toast("Customer approved the invoice");
      return;
    }
    if (t.id === "pay"){
      t.disabled = true; t.textContent = dirty ? "Synchronizing…" : "Opening secure payment…";
      ensureSynced().then(function(){ return call("pay", { id: cur.job.id }); }).then(function(d){
        if (d.paid){ openJob(cur.job.id); return; }
        window.location.href = d.url;
      }).catch(function(err){ toast(err.message); renderJob(); });
      return;
    }
    if (t.id === "paycheck"){ checkPayment(); return; }
    if (t.id === "reopen"){
      if (!confirm("Reopen this job to make changes? You'll need to complete it again." + (cur.job.pay_status === "paid" ? " The paid invoice stays locked." : ""))) return;
      t.disabled = true;
      call("reopen", { id: cur.job.id }).then(function(d){ cur = d; renderJob(); toast("Job reopened — make your changes, then complete it again"); })
        .catch(function(err){ t.disabled = false; toast(err.message); });
      return;
    }
    if (t.id === "u-add"){ draft = { location: "Hallway", other: "", type: "", photoKey: "", thumb: "", busy: false }; keepScroll(renderJob); return; }
    if (t.id === "d-cancel"){ if (draft && draft.photoKey) dropPhoto(draft.photoKey); draft = null; keepScroll(renderJob); return; }
    if (t.id === "d-save"){
      if (!draft.type){ toast("Choose battery or hardwired"); return; }
      if (storageOn() && !draft.photoKey){ toast("Take a photo of the alarm first"); return; }
      var loc = draft.location === "Other" ? (draft.other.trim() || "Other") : draft.location;
      var unitId = "u" + Date.now().toString(36), key = draft.photoKey;
      var next = unitList().concat([{ id: unitId, location: loc, type: draft.type, photo: "", photoKey: key }]);
      draft = null;
      var rec = key && localRecs.find(function(r){ return r.key === key; });
      if (rec){ rec.unitId = unitId; idbPut(rec).catch(function(){}); }
      syncAlarmItems(next); return;
    }
    var ud = t.closest("[data-unit-del]");
    if (ud){ if (!confirm("Delete this smoke alarm?")) return; var list = unitList().slice(), gone = list.splice(Number(ud.dataset.unitDel), 1)[0]; if (gone && gone.photoKey) dropPhoto(gone.photoKey); syncAlarmItems(list); return; }
    var sg = t.closest("[data-seg] button");
    if (sg){
      var kind = sg.parentNode.dataset.seg, v = sg.dataset.v;
      if (kind === "full"){ pay.full = v === "yes"; if (!pay.full) pay.method = ""; }
      else if (kind === "method") pay.method = v;
      persistDraft(); keepScroll(renderJob); return;
    }
    if (t.id === "so-open"){
      if (!confirm("This job isn't synchronized yet. Synchronize now to open work sign off?")) return;
      syncJob().catch(function(){});
      return;
    }
    if (t.id === "so-clear"){ sigData = null; persistDraft(); keepScroll(renderJob); return; }
    if (t.closest("[data-sync]")){ syncJob().catch(function(){}); return; }
    if (t.id === "complete"){
      if (!confirm(pay.full === false ? "Complete the job and email a pending invoice for " + money(cur.totals.due) + "?" : "Complete the job and email the invoice to the customer?")) return;
      t.disabled = true; t.textContent = "Completing…";
      Promise.resolve().then(function(){ if (dirty) throw new Error("Synchronize first"); return call("complete", { id: cur.job.id, paid_in_full: pay.full === true, method: pay.method, signoff_name: $("so-name").value.trim(), signature: sigData }); }).then(function(d){
        var inv = d.invoice || {};
        $("done-msg").textContent = "J" + d.job.job_no + " · " + d.job.customer_name + " · " +
          ({ paid:"paid in full.", later: money(cur.totals.due) + " owing, to be collected by the office.", none:"nothing to pay on site." }[d.job.pay_status] || "") +
          " " + (inv.status === "sent" ? "Invoice emailed to " + inv.to + "." : "Invoice email NOT sent" + (inv.error ? " (" + inv.error + ")" : "") + ". Tell the office.") +
          (d.certificate && d.certificate.status === "sent" ? " Compliance certificate emailed." :
            d.certificate && d.certificate.status === "failed" ? " Compliance certificate NOT sent (" + d.certificate.reason + "). Tell the office." :
            d.job.pay_status === "later" ? " The compliance certificate is sent once the invoice is paid." : "");
        clearDraft(cur.job.id); dirty = false;
        show("v-done");
      }).catch(function(err){ t.disabled = false; t.innerHTML = "Complete job &amp; send invoice"; toast(err.message); });
    }
  });
  $("j-body").addEventListener("input", function(e){
    if (e.target.id === "d-other" && draft) draft.other = e.target.value;
    if (e.target.id === "so-name"){ soName = e.target.value; persistDraft(); updateComplete(); }
    if (e.target.id === "j-notes"){
      cur.job.tech_notes = e.target.value;
      markDirty();
    }
  });
  $("j-body").addEventListener("change", function(e){
    var id = e.target.id;
    if (id === "j-notes") keepScroll(renderJob);
    if (id === "d-loc"){ draft.location = e.target.value; keepScroll(renderJob); }
    if (id === "d-type"){ draft.type = e.target.value; }
    if (id === "so-ok"){ soOk = e.target.checked; persistDraft(); updateComplete(); }
    if (id === "rc-file" && e.target.files.length){
      var rf = e.target.files[0], oldKey = pay.receiptKey;
      shrink(rf).then(function(data){
        return queuePhoto("receipt", data, null).then(function(rec){ if (oldKey) dropPhoto(oldKey); pay.receiptKey = rec.key; markDirty(); });
      }).catch(function(err){ toast(err.message); }).then(function(){ keepScroll(renderJob); });
    }
    if ((id === "d-file" || id === "d-file-lib") && e.target.files.length){
      var file = e.target.files[0]; draft.busy = true; keepScroll(renderJob);
      var old = draft.photoKey;
      shrink(file).then(function(data){
        return queuePhoto("alarms", data, null).then(function(rec){ if (old) dropPhoto(old); if (draft){ draft.photoKey = rec.key; draft.thumb = "data:image/jpeg;base64," + data; } });
      }).catch(function(err){ toast(err.message); }).then(function(){ if (draft){ draft.busy = false; keepScroll(renderJob); } });
    }
  });

  function keepScroll(fn){ var y = window.scrollY; fn(); window.scrollTo(0, y); }
  function wireItems(){
    return cur.items.map(function(i){ return i.code === "other" ? { code:"other", label: i.label, price: i.price || (i.unit_cents / 100).toFixed(2), qty: i.qty } : { code: i.code, qty: i.qty }; });
  }
  // Prices items locally for an instant update; the server re-prices when the job is synchronized.
  function applyItems(items){
    var rank = function(i){ var n = cur.catalogue.map(function(c){ return c.code; }).indexOf(i.code); return n < 0 ? 99 : n; };
    items = items.slice().sort(function(a, b){ return rank(a) - rank(b); });
    cur.items = items.map(function(i){
      var p = cur.catalogue.find(function(c){ return c.code === i.code; });
      var isA = cur.alarm_codes.indexOf(i.code) >= 0;
      var unit = isA ? ALARM_CENTS : p ? p.cents : Math.round(Number(i.price || i.unit_cents / 100) * 100);
      var label = p ? p.label : (isA ? (i.label || ALARM_LABEL[i.code]) : i.label);
      return Object.assign({}, i, { label: label, unit_cents: unit, amount_cents: unit * i.qty });
    });
    var total = cur.items.reduce(function(s, i){ return s + i.amount_cents; }, 0);
    var credit = Math.min(total, cur.credits.reduce(function(s, c){ return s + c.cents; }, 0));
    cur.totals = { total: total, credit: credit, due: total - credit };
  }
  var ALARM_CENTS = 7900, ALARM_LABEL = { alarm_battery: "Photoelectric smoke alarm (10-year battery) – supplied & installed", alarm_hardwired: "Photoelectric smoke alarm (240V hardwired) – supplied & installed" };
  function setItems(items){
    applyItems(items);
    cur.job.approved_at = null;
    markDirty();
    keepScroll(renderJob);
  }

  function checkPayment(){
    return call("pay_check", { id: cur.job.id }).then(function(d){
      if (d.paid){ toast("Payment received"); openJob(cur.job.id); }
      else toast("Payment not received yet");
    }).catch(function(err){ toast(err.message); });
  }

  $("done-back").addEventListener("click", function(){ day = startOfDay(new Date()); loadList(); });

  /* ---------- boot ---------- */
  function route(){
    var p = new URLSearchParams(location.search), job = p.get("job"), paidBack = p.get("paid");
    if (job){
      history.replaceState(null, "", location.pathname);
      openJob(job, paidBack ? function(){
        if (cur.job.pay_status === "paid") toast("Payment received");
        else checkPayment();
      } : null);
    } else loadList();
  }
  if (me && me.code) route(); else showLogin();
})();
</script>
</body>
</html>
