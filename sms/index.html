<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS Inbox - PowerSmart</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2343A8B6'/%3E%3Cpath d='M36 8 16 36h12l-4 20 20-28H32l4-20z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#43A8B6;--teal-dark:#2E8494;--teal-deep:#1E5F6B;--teal-soft:#E7F4F6;--teal-bright:#7FD6E2;
    --ink:#0B1B1F;--ink-2:#102529;--body:#41585D;--muted:#6B8288;--line:rgba(11,27,31,.10);--paper:#F4F9FA;
    --amber:#F5B841;--green:#3BAE6A;--red:#D96B6B;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#EDF3F4;
    display:flex;flex-direction:column;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  img{display:block}

  /* ---------- top bar (same as the pipeline) ---------- */
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:.65rem 1.1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;flex:none}
  .topbar .logo img{height:28px}
  .topbar h1{font-size:1rem;font-weight:800;letter-spacing:-.01em}
  .topbar h1 span{color:var(--teal-dark)}
  .tb-count{font-size:.74rem;font-weight:600;color:var(--teal-deep);background:var(--teal-soft);border-radius:999px;padding:.25rem .75rem}
  .tb-search{flex:1;min-width:160px;max-width:340px;position:relative}
  .tb-search input{width:100%;padding:.5rem .9rem .5rem 2.2rem;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);outline:none;font-size:.85rem}
  .tb-search input:focus{border-color:var(--teal);background:#fff}
  .tb-search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--muted)}
  .tb-actions{display:flex;gap:.5rem;margin-left:auto;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;font-size:.8rem;padding:.5rem 1rem;border-radius:999px;transition:transform .15s ease,background .15s ease;text-decoration:none}
  .btn-primary{background:var(--teal);color:var(--ink)}
  .btn-primary:hover{background:var(--teal-bright);transform:translateY(-1px)}
  .btn-ghost{border:1.5px solid var(--line);color:var(--body)}
  .btn-ghost:hover{border-color:var(--teal-dark);color:var(--teal-deep)}
  .btn:disabled{opacity:.55;cursor:wait}

  /* ---------- two-pane layout ---------- */
  .wrap{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;gap:.9rem;padding:1rem 1.1rem 1.2rem}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 2px 8px -3px rgba(11,27,31,.12)}
  .panel-head{padding:.8rem 1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line);flex:none}
  .panel-head h2{font-size:.82rem;font-weight:700}
  .panel-head .n{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--muted);background:var(--paper);border-radius:999px;padding:.1rem .55rem}

  /* conversation list */
  .list{flex:1;overflow-y:auto;scrollbar-width:thin;padding:.4rem}
  .sel-toggle{border:1px solid var(--line);background:#fff;font:inherit;font-size:.72rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;cursor:pointer;color:var(--ink)}
  .sel-toggle:hover,.sel-toggle.on{background:var(--paper)}
  .sel-bar{display:flex;align-items:center;gap:.5rem;padding:.45rem 1rem;border-bottom:1px solid var(--line);background:#fff4f2;font-size:.78rem;font-weight:700;flex:none;flex-wrap:wrap}
  .sel-bar[hidden]{display:none}.sel-bar .grow{flex:1}
  .sel-bar button{border:1px solid var(--line);background:#fff;font:inherit;font-size:.74rem;font-weight:700;padding:.25rem .65rem;border-radius:999px;cursor:pointer}
  .sel-bar button.danger{background:#c0392b;border-color:#c0392b;color:#fff}.sel-bar button:disabled{opacity:.45;cursor:default}
  .ck{width:18px;height:18px;border:2px solid #9fb4b8;border-radius:5px;flex:none;align-self:center;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;line-height:1}
  .ck.on{background:#c0392b;border-color:#c0392b}.ck.on::after{content:'✓'}
  .contact.picked{background:#fff1ef}
  .th-del{margin-left:auto;border:1px solid var(--line);background:#fff;color:#c0392b;font:inherit;font-size:.74rem;font-weight:700;padding:.3rem .75rem;border-radius:999px;cursor:pointer}
  .th-del:hover{background:#fff1ef}
  .contact{width:100%;text-align:left;display:flex;gap:.7rem;align-items:center;padding:.65rem .7rem;border-radius:11px;border:1px solid transparent;
    transition:background .15s ease,border-color .15s ease}
  .contact:hover{background:var(--paper)}
  .contact.active{background:var(--teal-soft);border-color:rgba(46,132,148,.25)}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--teal-soft);color:var(--teal-deep);font-size:.78rem;font-weight:700}
  .contact.active .avatar{background:var(--teal);color:var(--ink)}
  .c-main{min-width:0;flex:1}
  .c-top{display:flex;align-items:baseline;gap:.5rem}
  .c-name{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .c-time{font-size:.66rem;color:var(--muted);flex:none}
  .c-phone{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-msg{font-size:.76rem;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
  .c-msg.unread{font-weight:700;color:var(--ink)}
  .badge{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.1rem .45rem;border-radius:999px;
    background:#FDECEC;color:#8A2B2B;margin-left:.35rem;vertical-align:middle}
  .empty-col{font-size:.74rem;color:var(--muted);text-align:center;padding:1.1rem .6rem;margin:.5rem;border:1.5px dashed rgba(11,27,31,.15);border-radius:10px}
  .empty-col.err{color:#8A2B2B;border-color:#e9b8b8}

  /* thread */
  .thread{flex:1;min-height:0;display:flex;flex-direction:column}
  .thread-head{padding:.8rem 1.1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.75rem;flex:none}
  .thread-head .back{display:none;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;color:var(--muted)}
  .thread-head .back:hover{background:var(--paper);color:var(--ink)}
  .link-bar{padding:.55rem 1.1rem;border-bottom:1px solid var(--line);background:#f4f9fa;display:flex;flex-direction:column;gap:.45rem;flex:none}
  .link-bar .lk{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .5rem;font-size:.8rem}
  .link-bar .lk b{font-weight:800}.link-bar .lk .stg{color:var(--muted);font-size:.72rem}
  .link-bar .lb{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.74rem;font-weight:700;padding:.28rem .6rem;border-radius:999px;cursor:pointer;text-decoration:none}
  .link-bar .lb:hover{background:var(--paper)}.link-bar .lb.pri{background:var(--teal,#43A8B6);border-color:var(--teal,#43A8B6);color:#fff}
  .link-bar .none{font-size:.78rem;color:var(--muted)}
  .lk-results{display:flex;flex-direction:column;gap:.35rem;max-height:260px;overflow:auto;margin-top:.6rem}
  .lk-results button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.5rem .7rem;font:inherit;font-size:.82rem;cursor:pointer}
  .lk-results button:hover{background:var(--paper)}.lk-results small{display:block;color:var(--muted);font-size:.72rem}
  .th-title{font-size:.95rem;font-weight:800;line-height:1.2}
  .th-sub{font-size:.72rem;color:var(--muted)}
  .messages{flex:1;overflow-y:auto;padding:1.1rem 1.2rem;background:var(--paper);display:flex;flex-direction:column;gap:.35rem;scrollbar-width:thin}
  .day{align-self:center;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:.15rem .7rem;margin:.6rem 0 .3rem}
  .bubble{max-width:min(72%,560px);padding:.55rem .85rem;border-radius:14px;font-size:.85rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bubble{cursor:pointer}.bubble.sel{outline:2px solid #43A8B6;outline-offset:2px}
  .bubble .del{display:none;margin-top:.45rem;border:0;border-radius:999px;background:#c0392b;color:#fff;font:inherit;font-size:.72rem;font-weight:700;padding:.25rem .7rem;cursor:pointer}
  .bubble.sel .del{display:inline-block;margin-right:.4rem}
  .bubble .rs{display:block;margin-top:.45rem;background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;font:inherit;font-size:.74rem;font-weight:700;cursor:pointer;padding:0}
  .bubble .rs:hover{opacity:1}.bubble .rs.bad{background:#fff;color:#c0392b;opacity:1;padding:.25rem .7rem;border-radius:999px;text-decoration:none}
  .bubble.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble.out{align-self:flex-end;background:var(--teal-dark);color:#fff;border-bottom-right-radius:4px}
  .stamp{display:block;font-size:.62rem;opacity:.7;margin-top:.2rem}
  .bubble.in .stamp{color:var(--muted);opacity:1}
  .stamp .st-bad{color:#FFD3D3;font-weight:700}
  .th-empty{margin:auto;text-align:center;color:var(--muted);font-size:.85rem}

  .compose{padding:.8rem 1rem .5rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:flex-end;flex:none}
  .compose textarea{flex:1;min-height:44px;max-height:140px;resize:none;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);outline:none;font-size:.86rem;line-height:1.4}
  .compose textarea:focus{border-color:var(--teal);background:#fff}
  .status{padding:0 1.1rem .65rem;font-size:.7rem;color:var(--muted);display:flex;gap:.8rem;flex:none;min-height:1.4rem}
  .status .err{color:#B03A3A;font-weight:600}
  .status .grow{flex:1}
  .status .hint{opacity:.7}

  .placeholder{margin:auto;text-align:center;color:var(--muted);max-width:320px;padding:2rem}
  .placeholder .ic{width:56px;height:56px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
  .placeholder h2{font-size:1.05rem;font-weight:800;color:var(--ink);margin-bottom:.35rem}
  .placeholder p{font-size:.82rem}

  /* ---------- new-message modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(11,27,31,.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:min(420px,100%);display:flex;flex-direction:column;box-shadow:0 30px 70px -20px rgba(11,27,31,.5)}
  .modal-head{padding:1.1rem 1.4rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem}
  .modal-head h3{font-size:1.05rem;font-weight:800;flex:1}
  .modal-head .x{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .modal-head .x:hover{background:var(--paper);color:var(--ink)}
  .modal-body{padding:1.1rem 1.4rem}
  .field{display:flex;flex-direction:column;gap:.25rem}
  .field label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .field input{padding:.55rem .75rem;border:1.5px solid var(--line);border-radius:9px;background:var(--paper);outline:none;font-size:.86rem}
  .field input:focus{border-color:var(--teal);background:#fff}
  .modal-foot{padding:.9rem 1.4rem;border-top:1px solid var(--line);display:flex;gap:.6rem;justify-content:flex-end}

  /* toast */
  .toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:.65rem 1.2rem;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;transition:all .25s ease;z-index:120;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;padding:.7rem}
    .wrap .thread-panel{display:none}
    .wrap.open .list-panel{display:none}
    .wrap.open .thread-panel{display:flex}
    .thread-head .back{display:flex}
    .tb-search{order:9;max-width:none;flex-basis:100%}
    .hide-sm{display:none}
    .bubble{max-width:86%}
  }
</style>
</head>
<body>

  <header class="topbar">
    <a class="logo" href="https://portal.powersmartco.com.au/tools" title="Back to Sales Portal"><img src="/assets/logo/power-smart-logo-transparent.png" alt="Power Smart Co"></a>
    <h1>SMS <span>Inbox</span></h1>
    <span class="tb-count" id="total-count">0 conversations</span>
    <div class="tb-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="search" placeholder="Search name, phone, message…" autocomplete="off">
    </div>
    <div class="tb-actions">
      <a class="btn btn-ghost hide-sm" href="https://portal.powersmartco.com.au/tools">Quote Tool</a>
      <a class="btn btn-ghost hide-sm" href="https://portal.powersmartco.com.au/tools/pipeline">Pipeline</a>
      <a class="btn btn-ghost hide-sm" href="https://portal.powersmartco.com.au/tools/quote-tracker">Quote Tracker</a>
      <button class="btn btn-ghost" id="service-check" title="Check the SMS provider without sending a message">Check SMS service</button>
      <button class="btn btn-ghost" id="sync" title="Pull new replies from the SMS gateway">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Sync inbox
      </button>
      <button class="btn btn-primary" id="new-btn">＋ New message</button>
    </div>
  </header>

  <div id="service-status" role="status" hidden style="padding:10px 20px;background:#fff4df;color:#704c06;font-size:13px;flex-shrink:0"></div>
  <div class="wrap" id="wrap">
    <section class="panel list-panel">
      <div class="panel-head"><h2>Conversations</h2><button type="button" class="sel-toggle" id="sel-toggle" title="Select conversations to delete">Select</button><span class="n" id="list-n">0</span></div>
      <div class="sel-bar" id="sel-bar" hidden><span id="sel-count">0 selected</span><span class="grow"></span><button type="button" id="sel-all">Select all</button><button type="button" class="danger" id="sel-delete" disabled>Delete</button><button type="button" id="sel-cancel">Cancel</button></div>
      <div class="list" id="list"><div class="empty-col">Loading conversations…</div></div>
    </section>

    <section class="panel thread-panel">
      <div class="placeholder" id="empty">
        <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <h2>PowerSmart SMS</h2>
        <p>Choose a conversation on the left, or start a new message.</p>
      </div>
      <div class="thread" id="chat" hidden>
        <div class="thread-head">
          <button class="back" id="back" aria-label="Back to inbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
          <div class="avatar" id="th-avatar"></div>
          <div><div class="th-title" id="th-title"></div><div class="th-sub" id="th-sub"></div></div>
          <button type="button" class="th-del" id="th-del" title="Delete this whole conversation">Delete conversation</button>
        </div>
        <div class="link-bar" id="link-bar" hidden></div>
        <div class="messages" id="messages"></div>
        <form class="compose" id="compose">
          <textarea id="message" required maxlength="1600" rows="1" placeholder="Write an SMS…"></textarea>
          <button class="btn btn-primary" id="send" type="submit">Send</button>
        </form>
        <div class="status"><span id="status">Ready</span><span class="hint hide-sm">Enter to send · Shift+Enter for a new line</span><span class="grow"></span><span id="count"></span></div>
      </div>
    </section>
  </div>

  <!-- new message modal -->
  <div class="overlay" id="new-overlay">
    <div class="modal">
      <div class="modal-head"><h3>New message</h3><button class="x" id="new-close" aria-label="Close">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label for="newPhone">Mobile number</label><input id="newPhone" type="tel" placeholder="e.g. 0412 345 678 or +61412345678"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="new-cancel">Cancel</button>
        <button class="btn btn-primary" id="new-go">Start conversation</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="link-overlay">
    <div class="modal">
      <div class="modal-head"><h3>Connect to a customer</h3><button class="x" id="link-close" aria-label="Close">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label for="link-q">Search by name, email or phone</label><input id="link-q" type="search" autocomplete="off" placeholder="e.g. Kath, kath@example.com"></div>
        <div class="lk-results" id="link-results"><small style="color:var(--muted)">Type at least 2 letters.</small></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" id="link-cancel">Cancel</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
let conversations = [], active = null, activeName = '', lastSig = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(url, opt = {}) {
  const r = await fetch(url, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = Error(j.error || 'Request failed'); e.detail = j.detail || ''; throw e; }
  return j;
}
const showError = e => e.detail ? `${e.message} ${e.detail}` : e.message;

let toastTimer;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }
function setStatus(text, isErr) { const s = $('status'); s.textContent = text; s.className = isErr ? 'err' : ''; }

// Same 9-digit key the server uses, so 0451 898 761 and +61451898761 are one thread.
const phoneKey = v => { const d = String(v || '').replace(/\D/g, ''); return d.length >= 9 ? d.slice(-9) : d; };
const initials = (name, phone) => {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length) return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  return String(phone || '').replace(/\D/g, '').slice(-2) || '#';
};

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function when(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' });
  const days = Math.round((startOfDay(now) - startOfDay(d)) / 864e5);
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString('en-AU', { weekday: 'short' });
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}
function dayLabel(iso) {
  const d = new Date(iso);
  const days = Math.round((startOfDay(new Date()) - startOfDay(d)) / 864e5);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const rows = conversations.filter(c => ((c.name || '') + ' ' + c.phone_number + ' ' + c.message).toLowerCase().includes(q));
  $('total-count').textContent = `${conversations.length} conversation${conversations.length === 1 ? '' : 's'}`;
  $('list-n').textContent = rows.length;
  $('list').innerHTML = rows.map(c => {
    const isActive = active && phoneKey(active) === phoneKey(c.phone_number);
    const unread = c.status === 'received';
    const picked = selecting && selected.has(c.phone_number);
    return `<button class="contact ${isActive && !selecting ? 'active' : ''} ${picked ? 'picked' : ''}" data-phone="${esc(c.phone_number)}">
      ${selecting ? `<span class="ck ${picked ? 'on' : ''}"></span>` : ''}<div class="avatar">${esc(initials(c.name, c.phone_number))}</div>
      <div class="c-main">
        <div class="c-top"><span class="c-name">${esc(c.name || c.phone_number)}${c.status === 'optout' ? '<span class="badge">Opted out</span>' : ''}</span><span class="c-time">${esc(when(c.created_at))}</span></div>
        ${c.name ? `<div class="c-phone">${esc(c.phone_number)}</div>` : ''}
        <div class="c-msg ${unread ? 'unread' : ''}">${c.direction === 'outbound' ? 'You: ' : ''}${esc(c.message)}</div>
      </div></button>`;
  }).join('') || `<div class="empty-col">${q ? 'No conversations match your search.' : 'No conversations yet. Start one with “New message”.'}</div>`;
}

async function load() {
  try { conversations = (await api('/api/sms')).conversations || []; renderList(); }
  catch (e) { $('list').innerHTML = `<div class="empty-col err">${esc(showError(e))}</div>`; }
}

function setHead(name, phone) {
  activeName = name || '';
  $('th-avatar').textContent = initials(name, phone);
  $('th-title').textContent = name || phone;
  $('th-sub').textContent = name ? phone : '';
}

function renderMessages(messages, keepScroll) {
  const box = $('messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  let html = '', lastDay = '';
  messages.forEach(m => {
    const label = dayLabel(m.created_at);
    if (label !== lastDay) { html += `<div class="day">${esc(label)}</div>`; lastDay = label; }
    const bad = m.status && !['sent', 'received', 'delivered'].includes(m.status);
    const stuck = m.direction === 'outbound' && ['queued', 'pending', 'failed', 'unknown'].includes(m.status);
    const stLabel = { queued: 'not sent by the phone yet', pending: 'sending…', failed: 'failed', unknown: 'delivery unknown' }[m.status] || m.status;
    const locked = m.status === 'optout' || m.status === 'optin';
    html += `<div class="bubble ${m.direction === 'outbound' ? 'out' : 'in'}" data-id="${esc(m.id)}">${esc(m.message)}${m.direction === 'outbound' ? `<button type="button" class="rs ${stuck ? 'bad' : ''}" data-resend="${esc(m.id)}" title="Send this message again">${stuck ? '⚠ Not sent · Resend' : '↻ Resend'}</button>` : ''}${locked ? '' : `<button type="button" class="del" data-del="${esc(m.id)}">Delete message</button>`}<span class="stamp">${esc(new Date(m.created_at).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }))}${bad ? ` · <span class="st-bad">${esc(stLabel)}</span>` : ''}</span></div>`;
  });
  box.innerHTML = html || '<div class="th-empty">No messages yet. Say hello below.</div>';
  if (!keepScroll || nearBottom) box.scrollTop = box.scrollHeight;
}

async function openThread(phone, silent) {
  const switching = !silent;
  if (switching) {
    active = phone;
    $('wrap').classList.add('open');
    $('empty').hidden = true; $('chat').hidden = false; linkSig = ''; $('link-bar').hidden = true;
    const known = conversations.find(c => phoneKey(c.phone_number) === phoneKey(phone));
    setHead(known && known.name, phone);
    renderList();
    setStatus('Loading conversation…');
  }
  try {
    const data = await api('/api/sms?action=conversation&phone=' + encodeURIComponent(phone));
    if (phoneKey(active) !== phoneKey(phone)) return;           // user moved on while this was loading
    if (data.name) setHead(data.name, phone);
    renderLinkBar(phone, data.leads || []);
    const msgs = data.messages || [];
    const sig = msgs.length + ':' + (msgs.length ? msgs[msgs.length - 1].id : '');
    if (switching || sig !== lastSig) { renderMessages(msgs, !switching); lastSig = sig; }
    if (switching) { setStatus('Ready'); $('message').focus(); }
  } catch (e) { if (switching) setStatus(showError(e), true); }
}

/* ---------- delete a message: click it, then Delete message ---------- */
$('messages').addEventListener('click', async e => {
  const rs = e.target.closest('[data-resend]');
  if (rs && active) {
    const text = rs.closest('.bubble').firstChild.textContent;
    if (!confirm('Send this message again?\n\n' + text.slice(0, 160))) return;
    try {
      const r = await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'send', phone: active, message: text }) });
      toast(r.warning || 'Message sent again'); lastSig = ''; await load(); await openThread(active, true);
    } catch (err) { toast(showError(err)); }
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('Delete this message from the inbox?\n\nThe customer keeps their copy, and a note about it on their customer card is not removed.')) return;
    try {
      await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete_message', id: del.dataset.del }) });
      toast('Message deleted'); lastSig = ''; await load(); if (active) await openThread(active, true);
    } catch (err) { toast(showError(err)); }
    return;
  }
  const b = e.target.closest('.bubble');
  if (!b || (window.getSelection && String(window.getSelection()).length)) return;   // selecting text to copy is not a click
  const was = b.classList.contains('sel');
  document.querySelectorAll('.bubble.sel').forEach(x => x.classList.remove('sel'));
  if (!was) b.classList.add('sel');
});

/* ---------- connect a conversation to customers and quotes ---------- */
const PIPELINE = 'https://portal.powersmartco.com.au/tools/pipeline';
let linkSig = '';
function renderLinkBar(phone, leads) {
  const bar = $('link-bar'), sig = phone + JSON.stringify(leads);
  if (sig === linkSig) return;
  linkSig = sig;
  const stage = s => String(s || '').replace(/_/g, ' ');
  let html = leads.map(l => `<div class="lk"><b>${esc(l.name)}</b><span class="stg">${esc(stage(l.stage))}${l.quote_ref ? ' · quote ' + esc(l.quote_ref) : ''}</span>` +
    `<a class="lb pri" target="_blank" rel="noopener" href="${PIPELINE}?lead=${encodeURIComponent(l.id)}">Open customer</a>` +
    (l.quote_url ? `<a class="lb" target="_blank" rel="noopener" href="${esc(l.quote_url)}">View quote ${esc(l.quote_ref || '')}</a>` : '') +
    `<a class="lb" target="_blank" rel="noopener" href="${PIPELINE}?lead=${encodeURIComponent(l.id)}&quote=1">${l.quote_ref ? 'Send new quote' : 'Send quote'}</a></div>`).join('');
  html += leads.length
    ? `<div class="lk"><button class="lb" data-link="1" type="button">＋ Connect another customer</button></div>`
    : `<div class="none">Not connected to a customer yet.</div><div class="lk"><button class="lb pri" data-link="1" type="button">Connect to existing customer</button><button class="lb" data-create="1" type="button">Create new customer</button></div>`;
  bar.innerHTML = html; bar.hidden = false;
}
$('link-bar').addEventListener('click', e => {
  if (e.target.closest('[data-link]')) openLink();
  else if (e.target.closest('[data-create]')) createCustomer();
});
function openLink() { $('link-overlay').classList.add('show'); $('link-q').value = ''; $('link-results').innerHTML = '<small style="color:var(--muted)">Type at least 2 letters.</small>'; setTimeout(() => $('link-q').focus(), 40); }
function closeLink() { $('link-overlay').classList.remove('show'); }
let linkTimer;
$('link-q').addEventListener('input', () => {
  clearTimeout(linkTimer);
  linkTimer = setTimeout(async () => {
    const q = $('link-q').value.trim();
    if (q.length < 2) { $('link-results').innerHTML = '<small style="color:var(--muted)">Type at least 2 letters.</small>'; return; }
    try {
      const d = await api('/api/sms?action=lead_search&q=' + encodeURIComponent(q));
      $('link-results').innerHTML = (d.leads || []).map(l => `<button type="button" data-id="${esc(l.id)}" data-name="${esc(l.name)}">${esc(l.name)}<small>${esc(l.phone || 'no mobile saved')}${l.email ? ' · ' + esc(l.email) : ''} · ${esc(String(l.stage || '').replace(/_/g, ' '))}${l.quote_ref ? ' · quote ' + esc(l.quote_ref) : ''}</small></button>`).join('') || '<small style="color:var(--muted)">No customers found.</small>';
    } catch (e) { $('link-results').innerHTML = `<small class="err">${esc(showError(e))}</small>`; }
  }, 250);
});
$('link-results').addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b || !active) return;
  const post = replace => api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'link_lead', lead_id: b.dataset.id, phone: active, replace }) });
  try {
    try { await post(false); }
    catch (err) {
      if (!/different number/.test(err.message) || !confirm(err.message + '\n\nReplace it with ' + active + '?')) throw err;
      await post(true);
    }
    closeLink(); toast('Connected to ' + b.dataset.name); linkSig = ''; await load(); openThread(active, true);
  } catch (err) { toast(showError(err)); }
});
$('link-close').onclick = closeLink; $('link-cancel').onclick = closeLink;
async function createCustomer() {
  if (!active) return;
  const name = (prompt('Customer name for ' + active + ':') || '').trim();
  if (!name) return;
  const email = (prompt('Email address (optional, leave blank for none):') || '').trim();
  try {
    await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create_lead', phone: active, name, email }) });
    toast('Customer created: ' + name); linkSig = ''; await load(); openThread(active, true);
  } catch (err) { toast(showError(err)); }
}

/* ---------- delete whole conversations (also removes them from Supabase) ---------- */
let selecting = false; const selected = new Set();
const visibleRows = () => { const q = $('search').value.trim().toLowerCase(); return conversations.filter(c => ((c.name || '') + ' ' + c.phone_number + ' ' + c.message).toLowerCase().includes(q)); };
function updateSelBar() {
  $('sel-bar').hidden = !selecting;
  $('sel-toggle').classList.toggle('on', selecting); $('sel-toggle').textContent = selecting ? 'Done' : 'Select';
  $('sel-count').textContent = selected.size + ' selected';
  $('sel-delete').disabled = !selected.size; $('sel-delete').textContent = selected.size ? 'Delete ' + selected.size : 'Delete';
}
function setSelecting(on) { selecting = on; if (!on) selected.clear(); renderList(); updateSelBar(); }
$('sel-toggle').onclick = () => setSelecting(!selecting);
$('sel-cancel').onclick = () => setSelecting(false);
$('sel-all').onclick = () => { const rows = visibleRows(); const all = rows.every(c => selected.has(c.phone_number)); rows.forEach(c => all ? selected.delete(c.phone_number) : selected.add(c.phone_number)); renderList(); updateSelBar(); };
async function deleteConversations(phones, label) {
  if (!phones.length) return;
  if (!confirm('Delete ' + label + ' permanently?\n\nAll their messages are removed from the inbox and from the database. This cannot be undone. The customer keeps their own copy, and notes on their customer card are not removed.\n\n(A customer\'s STOP / START messages are kept so an opt-out is never lost.)')) return;
  try {
    const r = await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete_conversations', phones }) });
    toast('Deleted ' + r.deleted + ' message' + (r.deleted === 1 ? '' : 's') + (r.kept_consent_records ? '. ' + r.kept_consent_records + ' STOP/START record(s) kept.' : '.'));
    if (active && phones.some(p => phoneKey(p) === phoneKey(active))) { active = null; $('chat').hidden = true; $('empty').hidden = false; $('wrap').classList.remove('open'); }
    selected.clear(); setSelecting(false); await load();
  } catch (err) { toast(showError(err)); }
}
$('sel-delete').onclick = () => deleteConversations([...selected], selected.size === 1 ? 'this conversation' : selected.size + ' conversations');
$('th-del').onclick = () => { if (active) deleteConversations([active], 'this conversation'); };

function closeThread() { $('wrap').classList.remove('open'); }

function openNew() { $('new-overlay').classList.add('show'); setTimeout(() => $('newPhone').focus(), 40); }
function closeNew() { $('new-overlay').classList.remove('show'); }
function startConversation() {
  const p = $('newPhone').value.trim(); if (!p) return;
  closeNew(); $('newPhone').value = '';
  const known = conversations.find(c => phoneKey(c.phone_number) === phoneKey(p));
  openThread(known ? known.phone_number : p);
}

async function sendMessage(e) {
  e.preventDefault();
  const message = $('message').value.trim();
  if (!active || !message) return;
  const btn = $('send'); btn.disabled = true; setStatus('Sending…');
  try {
    await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'send', phone: active, message }) });
    $('message').value = ''; updateCount(); autoGrow();
    await openThread(active); await load();
  } catch (err) { setStatus(showError(err), true); }
  finally { btn.disabled = false; }
}

async function checkSmsService() {
  const btn = $('service-check'), notice = $('service-status');
  btn.disabled = true; notice.hidden = false; notice.textContent = 'Checking SMS service...';
  try {
    const r = await api('/api/sms?action=diagnostics', { headers: { 'x-portal-key': '2026' } });
    const when = v => v ? new Date(v).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
    const step = (ok, label, detail) => (ok === true ? 'OK  ' : ok === false ? 'FAIL' : 'NOTE') + '  ' + label + (detail ? ' - ' + detail : '');
    const lines = [];
    const self = r.selfTest || {};
    if (!r.gatewayReachable) {
      lines.push(step(false, 'SMS Gate account', [r.error, r.detail].filter(Boolean).join(' ')));
    } else {
      const stale = r.deviceLastSeen && Date.now() - new Date(r.deviceLastSeen) > 864e5;
      lines.push(step(r.deviceCount > 0, 'Sending phone registered with SMS Gate', r.deviceCount ? `${r.deviceCount} phone${r.deviceCount === 1 ? '' : 's'}${r.deviceLastSeen ? ', last seen ' + when(r.deviceLastSeen) : ''}` : 'none - open SMS Gate on the sending phone and sign in to Cloud server'));
      if (stale) lines.push(step(false, 'Sending phone online', 'not seen for over a day - open SMS Gate on the phone and check it is connected'));
      if (r.deviceIdMatches === false) lines.push(step(false, 'SMSGATE_DEVICE_ID in Vercel', 'does not match any registered phone (affects sending). Copy the Device ID from the SMS Gate app, or delete the variable, then redeploy'));
      lines.push(r.inboundConnected === false
        ? step(false, 'Replies connected to this portal', (r.staleWebhook ? 'connected to an old phone registration, not this phone' : 'not connected') + ' - tap Sync inbox to fix' + (r.webhookUrls && r.webhookUrls.length ? '. Currently sending to: ' + r.webhookUrls.join(', ') : ''))
        : step(r.inboundConnected === true ? true : null, 'Replies connected to this portal', r.inboundConnected === true ? 'every phone on the account forwards replies' : 'could not check'));
    }
    lines.push(step(self.ok === true, 'Portal accepts replies from the phone', self.ok ? 'test post answered' : (self.detail || 'not checked')));
    lines.push(step(null, 'Last reply stored', (r.lastInboundAt ? when(r.lastInboundAt) : 'never') + (r.lastOutboundAt ? ' · last text sent ' + when(r.lastOutboundAt) : '')));
    const allOk = r.gatewayReachable && r.deviceCount > 0 && r.inboundConnected === true && self.ok;
    if (allOk) lines.push('',
      'Everything on the portal side is working. If a customer reply shows on the sending phone but not here:',
      '- It most likely arrived as an RCS chat, which SMS Gate cannot see (iPhones on iOS 18+ use RCS too). In Google Messages (or Samsung Messages) on the sending phone: Settings > RCS chats / Chat features > turn OFF.',
      '- If that SIM was ever in an iPhone, deregister the number from iMessage: selfsolve.apple.com/deregister-imessage',
      '- SMS Gate app: Permissions > SMS = Allow (Android 13+: App info > ⋮ > Allow restricted settings first), Battery = Unrestricted.',
      'Then text the sending number from another phone. It should appear here within a minute.');
    lines.push('', 'This check does not send a text.');
    notice.style.whiteSpace = 'pre-line';
    notice.textContent = lines.join('\n');
  } catch (e) { notice.textContent = showError(e); }
  finally { btn.disabled = false; }
}
async function syncInbox() {
  const btn = $('sync'), notice = $('service-status');
  btn.disabled = true; notice.hidden = false; notice.textContent = 'Connecting replies and requesting the last 7 days of texts...';
  const step = (label, ok, detail) => (ok ? 'OK  ' : 'FAIL') + '  ' + label + (detail ? ' - ' + detail : '');
  try {
    const r = await api('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'sync' }) });
    const hookFailed = String(r.webhook || '').startsWith('failed');
    notice.style.whiteSpace = 'pre-line';
    notice.textContent = [
      step('Replies connected to this portal', !hookFailed, hookFailed ? r.webhook.slice(8) : r.webhook === 'registered' ? 'newly registered with SMS Gate' : 'already registered'),
      step('Asked the phone to resend the last 7 days of received texts', true, 'requested'),
      'New replies should appear within a minute. If none do, tap Check connection.',
    ].join('\n');
    toast(hookFailed ? 'Could not connect replies. See the details above the list.' : 'Inbox sync requested. New replies will appear shortly.');
    setTimeout(load, 4000); setTimeout(load, 15000);
  } catch (e) {
    notice.style.whiteSpace = 'pre-line';
    notice.textContent = [step('Inbox sync', false, showError(e))].join('\n');
    toast(showError(e));
  } finally { btn.disabled = false; }
}

function updateCount() {
  const len = $('message').value.length;
  // Multipart SMS are billed at 153 characters each once past the first 160.
  const parts = len <= 160 ? 1 : Math.ceil(len / 153);
  $('count').textContent = len ? `${len} characters · ${parts} SMS ${parts === 1 ? 'part' : 'parts'}` : '';
}
function autoGrow() { const t = $('message'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }

$('list').addEventListener('click', e => {
  const b = e.target.closest('.contact'); if (!b) return;
  if (!selecting) { openThread(b.dataset.phone); return; }
  const p = b.dataset.phone; selected.has(p) ? selected.delete(p) : selected.add(p);
  renderList(); updateSelBar();
});
$('search').addEventListener('input', renderList);
$('new-btn').onclick = openNew;
$('new-close').onclick = closeNew; $('new-cancel').onclick = closeNew; $('new-go').onclick = startConversation;
$('new-overlay').addEventListener('click', e => { if (e.target === $('new-overlay')) closeNew(); });
$('newPhone').addEventListener('keydown', e => { if (e.key === 'Enter') startConversation(); });
$('sync').onclick = syncInbox;
// Once per browser session, quietly make sure customer replies are wired up (safe to repeat).
try {
  if (!sessionStorage.getItem('sms-connected-v2')) {
    fetch('/api/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'connect' }) })
      .then(r => r.json().then(j => ({ ok: r.ok, j }))).then(({ ok, j }) => {
        if (!ok) return;
        sessionStorage.setItem('sms-connected-v2', '1');
        if (j.webhook === 'registered') { toast('Replies are now connected. Fetching recent texts...'); syncInbox(); }
      }).catch(() => {});
  }
} catch (_) { /* private mode */ }
$('service-check').onclick = checkSmsService;
$('back').onclick = closeThread;
$('compose').addEventListener('submit', sendMessage);
$('message').addEventListener('input', () => { updateCount(); autoGrow(); });
$('message').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('compose').requestSubmit(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNew(); });

const initialPhone = new URLSearchParams(location.search).get('phone');
load().then(() => { if (initialPhone) openThread(initialPhone); });
// Keep the inbox and the open thread fresh without disturbing what's being typed or scrolled.
setInterval(() => { load(); if (active) openThread(active, true); }, 15000);
</script>
</body>
