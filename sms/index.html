<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMS | PowerSmart</title>
<style>
:root{--cyan:#08aeca;--deep:#087a95;--soft:#e8f9fc;--ink:#142c33;--muted:#668087;--line:#d8e8eb;--page:#f3f8f9;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--page);font:14px Inter,Arial,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:350px 1fr;max-width:1500px;margin:auto;background:var(--white);box-shadow:0 0 40px #0c465014}.side{border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}.brand b{font-size:22px;letter-spacing:-.6px;color:var(--deep)}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;padding:14px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--cyan);color:#fff}.btn:hover{background:var(--deep)}.btn.secondary{background:var(--soft);color:var(--deep)}.search{padding:0 14px 12px}.search input,.new input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;outline:none}.search input:focus,.new input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #08aeca1c}.new{display:none;padding:0 14px 12px}.new.show{display:block}.new label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px}.new button{width:100%;margin-top:10px}.list{overflow:auto;flex:1}.contact{width:100%;text-align:left;border:0;border-top:1px solid #eef4f5;background:#fff;padding:14px 18px;cursor:pointer}.contact:hover,.contact.active{background:var(--soft)}.contact strong,.contact small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact strong{font-size:14px}.contact small{color:var(--muted);margin-top:4px}.main{display:flex;min-width:0;flex-direction:column}.empty{margin:auto;text-align:center;color:var(--muted);max-width:320px}.empty h1{color:var(--deep);font-size:25px}.thread-head{padding:20px 26px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}.messages{overflow:auto;flex:1;padding:26px;background:linear-gradient(135deg,#f5fbfc,#edf8fa)}.bubble{max-width:min(72%,620px);padding:11px 14px;border-radius:14px;margin:8px 0;line-height:1.45;box-shadow:0 1px 2px #00354113}.out{background:var(--cyan);color:white;margin-left:auto;border-bottom-right-radius:3px}.in{background:white;border-bottom-left-radius:3px}.stamp{display:block;font-size:10px;opacity:.72;margin-top:5px}.compose{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:end}.compose textarea{height:48px;resize:none}.status{padding:8px 22px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}@media(max-width:700px){.app{grid-template-columns:1fr}.side{height:100vh}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex;height:100vh}.back{display:inline!important}.compose{padding:12px}.thread-head{padding:15px}.messages{padding:14px}}.pl{margin-left:auto;font-size:12px;font-weight:700;color:var(--deep);text-decoration:none;background:var(--soft);border-radius:8px;padding:7px 11px}.thread-head{display:flex;align-items:center}.back{display:none;border:0;background:none;color:var(--deep);font-weight:bold;margin-right:10px}
</style></head><body><div class="app" id="app"><aside class="side"><div class="brand"><b>PowerSmart</b><span>SMS customer conversations</span></div><div class="actions"><button class="btn" onclick="toggleNew()">+ New message</button><button class="btn secondary" onclick="syncInbox()">Sync inbox</button></div><div class="new" id="new"><label>Mobile number</label><input id="newPhone" placeholder="e.g. +61412345678"><button class="btn" onclick="startConversation()">Start conversation</button></div><div class="search"><input id="search" oninput="renderList()" placeholder="Search conversations"></div><div class="list" id="list"></div></aside><main class="main" id="main"><div class="empty" id="empty"><h1>PowerSmart SMS</h1><p>Choose a conversation, or start a new message.</p></div><section id="chat" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"><div class="thread-head"><button class="back" onclick="closeThread()">‹ Inbox</button><span id="title"></span><a class="pl" id="pl" target="_blank" rel="noopener" title="Open this customer in the sales pipeline">Open in pipeline ↗</a></div><div class="messages" id="messages"></div><form class="compose" onsubmit="sendMessage(event)"><textarea id="message" required maxlength="1600" placeholder="Write an SMS…"></textarea><button class="btn">Send</button></form><div class="status" id="status">Ready</div></section></main></div><script>
let conversations=[],active=null;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function toggleNew(){$('new').classList.toggle('show');$('newPhone').focus()}function renderList(){const q=$('search').value.toLowerCase();$('list').innerHTML=conversations.filter(c=>(c.phone_number+c.message).toLowerCase().includes(q)).map(c=>`<button class="contact ${active===c.phone_number?'active':''}" onclick="openThread('${c.phone_number}')"><strong>${esc(c.phone_number)}</strong><small>${esc(c.message)}</small></button>`).join('')||'<p style="padding:18px;color:#668087">No conversations yet.</p>'}async function load(){try{conversations=(await api('/api/sms')).conversations||[];renderList()}catch(e){$('list').innerHTML=`<p style="padding:18px;color:#a33">${esc(e.message)}</p>`}}async function openThread(phone){active=phone;$('app').classList.add('open');$('empty').hidden=true;$('chat').hidden=false;$('title').textContent=phone;$('pl').href='/tools/pipeline?phone='+encodeURIComponent(phone);renderList();$('status').textContent='Loading conversation…';try{const data=await api('/api/sms?action=conversation&phone='+encodeURIComponent(phone));$('messages').innerHTML=data.messages.map(m=>`<div class="bubble ${m.direction==='outbound'?'out':'in'}">${esc(m.message)}<span class="stamp">${new Date(m.created_at).toLocaleString()}${m.status?' · '+esc(m.status):''}</span></div>`).join('')||'<p>No messages yet.</p>';$('messages').scrollTop=$('messages').scrollHeight;$('status').textContent='Ready'}catch(e){$('status').textContent=e.message}}function closeThread(){$('app').classList.remove('open')}function startConversation(){const p=$('newPhone').value.trim();if(!p)return;$('new').classList.remove('show');openThread(p)}async function sendMessage(e){e.preventDefault();const message=$('message').value.trim();if(!active||!message)return;$('status').textContent='Sending…';try{await api('/api/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send',phone:active,message})});$('message').value='';await openThread(active);await load()}catch(e){$('status').textContent=e.message}}async function syncInbox(){$('status').textContent='Requesting inbox sync…';try{await api('/api/sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sync'})});$('status').textContent='Inbox sync requested. New replies will appear shortly.';setTimeout(load,3000)}catch(e){$('status').textContent=e.message}}load().then(()=>{const p=new URLSearchParams(location.search).get('phone');if(p){history.replaceState(null,'',location.pathname);openThread(p)}});setInterval(load,15000);
</script></body></html>
